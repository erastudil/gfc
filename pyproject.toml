[project]
name = "gfc-clarity"
version = "1.0.1"
description = "Greene Feynman Clarity: writing standard and tooling for human-facing agent prose"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Humans and AI" }]
keywords = ["agents", "writing", "prose", "lint", "agpl"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing",
]

[project.urls]
Homepage = "https://github.com/erastudil/gfc"
License = "https://github.com/erastudil/gfc/blob/main/LICENSE"

[project.scripts]
gfc = "gfc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
